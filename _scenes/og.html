<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}html,body{width:1200px;height:630px;overflow:hidden}
body{position:relative;font-family:"Space Grotesk",sans-serif;color:#e9e7f5;background:radial-gradient(ellipse at 78% 40%,rgba(139,92,246,.35),transparent 55%),radial-gradient(ellipse at 10% 100%,rgba(91,140,255,.22),transparent 50%),#0b0a14}
body::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(169,139,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(169,139,255,.07) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse at 70% 40%,#000,transparent 75%)}
.copy{position:absolute;left:72px;top:0;bottom:0;width:600px;display:flex;flex-direction:column;justify-content:center;gap:22px}
.brand{display:flex;align-items:center;gap:14px;font-weight:700;font-size:30px}
.brand img{height:40px}
h1{font-size:58px;line-height:1.05;letter-spacing:-.02em}
h1 em{font-style:normal;color:#f5c542}
p{font:500 20px "JetBrains Mono",monospace;color:#b9b2ff}
.logo{position:absolute;right:-70px;top:5px;width:600px;height:600px}
.code{position:absolute;font:500 15px "JetBrains Mono",monospace;color:rgba(185,178,255,.25)}
</style></head><body>
<span class="code" style="left:72px;top:40px">// compile(intent) → manifest</span>
<span class="code" style="left:72px;bottom:40px">bind(this, that);</span>
<div class="copy">
  <div class="brand"><img src="/brand/logo-mark.svg" alt="">Wilk Works</div>
  <h1>El código es la <em>magia</em> de nuestro mundo</h1>
  <p>Software a medida · Cloud · Soporte TI</p>
</div>
<img class="logo" src="/brand/logo.svg" alt="">
</body></html>
